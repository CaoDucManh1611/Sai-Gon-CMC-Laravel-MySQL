services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cmms_laravel
      MYSQL_USER: cmms
      MYSQL_PASSWORD: cmms_local_password
      MYSQL_ROOT_PASSWORD: cmms_local_root_password
    volumes:
      - cmms_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    working_dir: /app/laravel
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000
volumes:
  cmms_mysql:
